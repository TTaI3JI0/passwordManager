[project]
name = "passwordmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TTaI3JI0", email = "atikinlyutkinn@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP",
    "B", "SIM", "ANN", "D"]

[tool.mypy]
strict = true
python_version = "3.14"
